# Cloudflare Pages 配置 - 用于部署 MoonTV (LunaTV)
# 使用方式：
# 1. pnpm install && pnpm build && pnpm pages:build
# 2. pnpm pages:deploy

name = "lunatv"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages 构建输出目录（由 @cloudflare/next-on-pages 生成）
pages_build_output_dir = ".vercel/output/static"

# KV 命名空间绑定（用于存储播放记录、收藏、用户等数据）
# 使用前需在 Cloudflare Dashboard 创建 KV 命名空间，并将 ID 替换到这里
# 创建位置：Workers & Pages → KV → 创建命名空间（名称建议：lunatv-kv）
[[kv_namespaces]]
binding = "MOONTV_KV"
id = "请替换为你的KV命名空间ID"